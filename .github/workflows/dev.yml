name: Dev Publish Push

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: whyisthecodeworking/telosrepo

jobs:
  publish_push_img:
    name: Publish Push Img
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Publish build
        run: ./mvnw -B clean package -DskipTests -Dmaven.compiler.proc=full

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build -f telos.docker -t "$IMAGE_REPOSITORY:${GITHUB_SHA::7}-dev" -t "$IMAGE_REPOSITORY:latest" .
          docker push --all-tags "$IMAGE_REPOSITORY"

name: Staging Publish Push Deploy

on:
  push:
    branches:
      - staging_telos
  workflow_dispatch:

permissions:
  contents: write

env:
  AWS_REGION: eu-north-1
  IMAGE_REPOSITORY: whyisthecodeworking/telosrepo
  STACK_NAME: telos

jobs:
  publish_push_deploy:
    name: Publish Push Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Increment version
        shell: pwsh
        run: ./Increment-Version.ps1 -Branch staging_telos -VersionFilePath ./version.json

      - name: Publish build
        run: ./mvnw -B clean package -DskipTests -Dmaven.compiler.proc=full

      - name: Commit bumped version
        run: |
          version=$(jq -r .version version.json)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "bump version to $version [skip ci]"
          git push origin HEAD:refs/heads/staging_telos

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: |
          IMAGE_TAG="$VERSION-staging_telos"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          docker build -f telos.docker -t "$IMAGE_REPOSITORY:$IMAGE_TAG" -t "$IMAGE_REPOSITORY:latest" .
          docker push --all-tags "$IMAGE_REPOSITORY"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to ECS
        run: |
          aws cloudformation update-stack --stack-name "$STACK_NAME" --use-previous-template \
            --capabilities CAPABILITY_IAM \
            --parameters \
              ParameterKey=ImageTag,ParameterValue="$IMAGE_TAG" \
              ParameterKey=ImageRepository,UsePreviousValue=true \
              ParameterKey=DockerHubSecretArn,UsePreviousValue=true \
              ParameterKey=VpcId,UsePreviousValue=true \
              ParameterKey=SubnetIds,UsePreviousValue=true \
              ParameterKey=DesiredCount,UsePreviousValue=true \
              ParameterKey=CertificateArn,UsePreviousValue=true
          aws cloudformation wait stack-update-complete --stack-name "$STACK_NAME"

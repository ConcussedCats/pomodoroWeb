<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signing Out - Telos</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" th:href="@{/assets/icon/icon.ico}" type="image/x-icon">
</head>
<body class="auth-page auth-page--panel auth-page--login">
    <th:block th:replace="~{fragments/header :: header('')}"></th:block>

    <main class="main-content auth-main">
        <div class="container auth-shell login-shell">
            <section class="auth-card auth-card--compact auth-panel-card login-card">
                <div class="auth-card__header">
                    <h2 class="auth-title">Signing you out</h2>
                    <p class="auth-description">If nothing happens, use the button below.</p>
                </div>

                <form id="logoutForm" class="auth-form" th:action="@{/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn--primary auth-submit">Log Out</button>
                </form>
            </section>
        </div>
    </main>

    <th:block th:replace="~{fragments/footer :: footer}"></th:block>

    <script>
        (() => {
            const form = document.getElementById("logoutForm");
            if (!form) return;

            window.requestAnimationFrame(() => form.submit());
        })();
    </script>
</body>
</html>

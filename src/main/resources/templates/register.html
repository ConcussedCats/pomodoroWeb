<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Telos</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" th:href="@{/assets/icon/icon.ico}" type="image/x-icon">
</head>
<body>
    <th:block th:replace="~{fragments/header :: header('login')}"></th:block>

    <main class="main-content">
        <div class="container auth-shell">
            <section class="auth-card auth-card--compact">
                <p class="eyebrow">Create Account</p>
                <h2 class="auth-title">Register</h2>
                <p class="auth-description">Start using Telos with your own account and keep your focus settings in one place.</p>

                <form id="registerForm" class="auth-form" novalidate th:action="@{/register}" method="post">
                    <p class="form-message form-message--error" th:if="${error}" th:text="${error}"></p>
                    <input type="hidden" th:name="${_csrf.getParameterName()}" th:value="${_csrf.getToken()}">

                    <div class="auth-field">
                        <label class="settings-label" for="registerUsername">Username</label>
                        <input
                                type="text"
                                id="registerUsername"
                                class="settings-input auth-input"
                                name="username"
                                autocomplete="username"
                                th:value="${username}">
                        <p class="form-field-error hidden" data-error-for="registerUsername"></p>
                    </div>

                    <div class="auth-field">
                        <label class="settings-label" for="registerEmail">Email</label>
                        <input
                                type="email"
                                id="registerEmail"
                                class="settings-input auth-input"
                                name="email"
                                autocomplete="email"
                                th:value="${email}">
                        <p class="form-field-error hidden" data-error-for="registerEmail"></p>
                    </div>

                    <div class="auth-field">
                        <label class="settings-label" for="registerPassword">Password</label>
                        <input
                                type="password"
                                id="registerPassword"
                                class="settings-input auth-input"
                                name="password"
                                autocomplete="new-password">
                        <p class="form-field-error hidden" data-error-for="registerPassword"></p>
                    </div>

                    <div class="auth-field">
                        <label class="settings-label" for="registerConfirmPassword">Confirm Password</label>
                        <input
                                type="password"
                                id="registerConfirmPassword"
                                class="settings-input auth-input"
                                name="confirmPassword"
                                autocomplete="new-password">
                        <p class="form-field-error hidden" data-error-for="registerConfirmPassword"></p>
                    </div>

                    <p class="form-message hidden" data-form-message aria-live="polite"></p>

                    <button type="submit" class="btn btn--primary auth-submit">Create account</button>

                    <p class="auth-description">
                        Already have an account?
                        <a th:href="@{/login}">Login here</a>
                    </p>
                </form>
            </section>
        </div>
    </main>

    <th:block th:replace="~{fragments/footer :: footer}"></th:block>

    <th:block th:replace="~{fragments/mini-timer-scripts :: scripts}"></th:block>
</body>
</html>

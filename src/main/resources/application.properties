spring.application.name=telos

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/telos_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=none

spring.sql.init.mode=never
spring.sql.init.platform=postgres

spring.web.resources.chain.enabled=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# дефолтний JWT_SECRET, на хості буде інший і буде він у змінних оточення
jwt.secret=${JWT_SECRET:5hLWRyorOP4B/z4D5PO0ta/YEZJjLdFai+XuOV99DA4=}
# поки хай буде 1 година, згодом через змінні оточення дамо інший час
# і ще, тут час у мілісекундах, якщо треба буде змінити на інше значення (секунди/хвилини/години), то зроблю це згодом
jwt.expiration=${JWT_EXPIRATION:3600000}

spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Kyiv
spring.jackson.time-zone=Europe/Kyiv

# ESP32 Pomodoro Flip Cube integration (see docs/esp32/PROTOCOL.md)
telos.device.pairing-ttl=${DEVICE_PAIRING_TTL:PT5M}
telos.device.heartbeat-interval=${DEVICE_HEARTBEAT_INTERVAL:PT30S}
telos.device.offline-after=${DEVICE_OFFLINE_AFTER:PT90S}
telos.device.command-ttl=${DEVICE_COMMAND_TTL:PT30S}
telos.device.command-poll-interval=${DEVICE_COMMAND_POLL_INTERVAL:PT3S}
telos.device.sweep-interval=${DEVICE_SWEEP_INTERVAL:PT5S}
